<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toyota 7F 前輪系統｜視覺零件目錄</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
      color: var(--text);
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
    }

    .panel {
      background: rgba(17,24,39,0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    .sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search-row input { min-width: 0; }
    .search-row button { flex-shrink: 0; white-space: nowrap; }

    .data-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      background: #0b1220;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
    }

    .file-label { position: relative; }
    .file-label input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
    }

    button:focus-visible, input:focus-visible, .file-label:focus-within {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .data-status { color: var(--muted); font-size: .86rem; overflow-wrap: anywhere; }
    .data-status.error { color: #fca5a5; }

    input[type="search"] {
      width: 100%;
      background: #0b1220;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    button {
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .canvas-wrap {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #0b1220;
      min-height: 540px;
    }

    .wheel-svg {
      width: 100%;
      height: 540px;
      display: block;
    }

    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: var(--accent);
      box-shadow: 0 0 0 2px rgba(56,189,248,0.3);
      cursor: pointer;
      transition: transform .15s ease;
    }

    .hotspot:hover { transform: translate(-50%, -50%) scale(1.1); }

    .hotspot.active { background: var(--accent-2); }

    .hotspot.hidden { display: none; }

    .legend {
      margin-top: 10px;
      color: var(--muted);
      font-size: .86rem;
    }

    .cards {
      display: grid;
      gap: 10px;
      max-height: 310px;
      overflow: auto;
      padding-right: 4px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: #0b1220;
      cursor: pointer;
    }

    .item { width: 100%; text-align: left; font: inherit; }
    .item .item-name { display: block; margin: 0 0 6px; font-size: 1rem; font-weight: 700; }
    .item .code { color: var(--accent); font-size: .88rem; }
    .item.active { border-color: var(--accent-2); }

    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #422006;
      color: #fde68a;
      font-size: .78rem;
    }

    .badge.verified { background: #052e16; color: #86efac; }
    .badge.test { background: #172554; color: #93c5fd; }

    .detail {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      padding: 14px;
      min-height: 220px;
    }

    .grid {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 8px 12px;
      font-size: .93rem;
    }

    .k { color: var(--muted); }
    .grid > div { min-width: 0; overflow-wrap: anywhere; }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      font-size: .9rem;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .canvas-wrap, .wheel-svg { min-height: 420px; height: 420px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <h1>Toyota 7F 前輪系統（視覺零件目錄）</h1>
      <p class="sub">左圖為前輪示意圖（placeholder），可點擊熱點查看右側資料卡。</p>

      <div class="data-row">
        <label class="file-label">
          載入零件資料（JSON）
          <input id="dataFile" type="file" accept="application/json,.json" />
        </label>
        <button id="resetDataBtn" type="button">恢復待確認資料</button>
        <span id="dataStatus" class="data-status" role="status" aria-live="polite" aria-atomic="true">目前為展示模式：料號尚未核對，不可用於報價。</span>
      </div>

      <div class="search-row">
        <input id="searchInput" aria-label="搜尋零件名稱或料號" type="search" placeholder="搜尋：OEM / 零件名稱 / 健彰 / ZEFENG / 我家SKU" />
        <button id="clearBtn" type="button">清除</button>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <svg class="wheel-svg" viewBox="0 0 800 540" aria-label="前輪示意圖">
          <rect width="800" height="540" fill="#0a0f1a"></rect>
          <rect x="120" y="230" width="560" height="120" rx="18" fill="#1f2937" stroke="#475569" stroke-width="2"/>
          <circle cx="300" cy="290" r="145" fill="#111827" stroke="#64748b" stroke-width="4"/>
          <circle cx="300" cy="290" r="95" fill="#1f2937" stroke="#94a3b8" stroke-width="3"/>
          <circle cx="300" cy="290" r="40" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
          <rect x="510" y="250" width="120" height="80" rx="12" fill="#374151" stroke="#64748b" stroke-width="2"/>
          <text x="400" y="65" fill="#94a3b8" font-size="18" text-anchor="middle">Front Wheel Placeholder Diagram</text>
        </svg>
      </div>
      <div class="legend">熱點：輪胎 / 螺絲 / 輪轂 / 培林 / 油封 / 煞車。黃色：待確認；藍色：僅供測試；綠色：已有核對紀錄。</div>
      <p class="sub">空白料號代表未提供；核對紀錄僅適用於已填欄位，報價前仍須確認車型與適用性。</p>
    </section>

    <section class="panel">
      <h2 style="margin:0 0 10px;">零件清單與資料卡</h2>
      <div id="list" class="cards"></div>
      <div id="emptyState" class="empty" style="display:none;">沒有符合搜尋條件的零件。</div>

      <article class="detail" id="detailCard">
        <h3 style="margin-top:0;">請先點選左側熱點或清單</h3>
        <p class="sub" style="margin:0;">資料卡將顯示零件完整資訊。</p>
      </article>
    </section>
  </div>

  <script>
    const placeholderParts = [
      {
        id: "tire",
        name: "前輪輪胎",
        verification: { status: "pending" },
        note: "展示資料；料號、適用車型與維修規範尚待來源核對。",
        hotspot: { x: 23, y: 55 },
      },
      {
        id: "lug_nut",
        name: "輪圈螺絲 / 螺帽",
        verification: { status: "pending" },
        note: "展示資料；料號、適用車型與維修規範尚待來源核對。",
        hotspot: { x: 31, y: 54 },
      },
      {
        id: "hub",
        name: "前輪輪轂",
        verification: { status: "pending" },
        note: "展示資料；料號、適用車型與維修規範尚待來源核對。",
        hotspot: { x: 37, y: 54 },
      },
      {
        id: "bearing",
        name: "輪轂培林",
        verification: { status: "pending" },
        note: "展示資料；料號、適用車型與維修規範尚待來源核對。",
        hotspot: { x: 43, y: 54 },
      },
      {
        id: "oil_seal",
        name: "輪轂油封",
        verification: { status: "pending" },
        note: "展示資料；料號、適用車型與維修規範尚待來源核對。",
        hotspot: { x: 49, y: 54 },
      },
      {
        id: "brake",
        name: "前輪煞車組",
        verification: { status: "pending" },
        note: "展示資料；料號、適用車型與維修規範尚待來源核對。",
        hotspot: { x: 71, y: 54 },
      }
    ];

    let partsData = structuredClone(placeholderParts);

    const state = {
      query: "",
      filtered: [...partsData],
      activeId: null,
    };

    const listEl = document.getElementById("list");
    const detailEl = document.getElementById("detailCard");
    const searchInput = document.getElementById("searchInput");
    const canvasWrap = document.getElementById("canvasWrap");
    const emptyState = document.getElementById("emptyState");
    const dataStatus = document.getElementById("dataStatus");

    function isVerified(part) {
      return part.verification?.status === "verified";
    }

    function isTest(part) {
      return part.verification?.status === "test";
    }

    function hasPartNumber(part) {
      return [part.oem, part.aftermarket?.jianzhang, part.aftermarket?.zefeng, part.sku]
        .some(value => typeof value === "string" && value.trim());
    }

    function statusBadge(part) {
      const kind = isVerified(part) ? "verified" : isTest(part) ? "test" : "";
      const label = isVerified(part) ? "已填料號有核對紀錄" : isTest(part) ? "僅供測試・不可報價" : "待確認";
      return `<span class="badge ${kind}">${label}</span>`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;"
      })[character]);
    }

    function matches(part, query) {
      const haystack = [
        part.name,
        isVerified(part) ? part.oem : "",
        isVerified(part) ? part.aftermarket?.jianzhang : "",
        isVerified(part) ? part.aftermarket?.zefeng : "",
        isVerified(part) ? part.sku : "",
        part.note,
      ].join(" ").toLowerCase();
      return haystack.includes(query.toLowerCase());
    }

    function positionHotspot(button, part) {
      // SVG uses xMidYMid meet: account for the blank space around its viewBox.
      const width = canvasWrap.clientWidth;
      const height = canvasWrap.clientHeight;
      const scale = Math.min(width / 800, height / 540);
      button.style.left = `${(width - 800 * scale) / 2 + part.hotspot.x / 100 * 800 * scale}px`;
      button.style.top = `${(height - 540 * scale) / 2 + part.hotspot.y / 100 * 540 * scale}px`;
    }

    function renderHotspots() {
      const old = canvasWrap.querySelectorAll(".hotspot");
      old.forEach(el => el.remove());

      state.filtered.forEach(part => {
        const btn = document.createElement("button");
        btn.className = "hotspot" + (state.activeId === part.id ? " active" : "");
        positionHotspot(btn, part);
        btn.title = part.name;
        btn.setAttribute("aria-label", `查看${part.name}`);
        btn.type = "button";
        btn.dataset.partId = part.id;
        btn.setAttribute("aria-pressed", String(state.activeId === part.id));
        btn.addEventListener("click", () => selectPart(part.id));
        canvasWrap.appendChild(btn);
      });
    }

    function renderList() {
      listEl.innerHTML = "";
      if (state.filtered.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
      }

      state.filtered.forEach(part => {
        const item = document.createElement("button");
        item.type = "button";
        item.dataset.partId = part.id;
        item.setAttribute("aria-pressed", String(state.activeId === part.id));
        item.className = "item" + (state.activeId === part.id ? " active" : "");
        item.innerHTML = `
          <span class="item-name">${part.name}</span>
          ${statusBadge(part)}
          ${isVerified(part) ? `<div class="code">OEM: ${escapeHtml(part.oem || "—")}</div>` : ""}
        `;
        item.addEventListener("click", () => selectPart(part.id));
        listEl.appendChild(item);
      });
    }

    function renderDetail(part) {
      if (!part) {
        detailEl.innerHTML = `
          <h3 style="margin-top:0;">找不到資料</h3>
          <p class="sub" style="margin:0;">請調整搜尋條件或重新選擇零件。</p>
        `;
        return;
      }

      detailEl.innerHTML = `
        <h3 style="margin-top:0; margin-bottom: 10px;">${part.name}</h3>
        <div class="grid">
          <div class="k">零件名稱（白話）</div><div>${part.name}</div>
          <div class="k">資料狀態</div><div>${statusBadge(part)}</div>
          ${isVerified(part) || isTest(part) ? `
            <div class="k">Toyota OEM 料號</div><div>${escapeHtml(part.oem || "—")}</div>
            <div class="k">健彰料號</div><div>${escapeHtml(part.aftermarket?.jianzhang || "—")}</div>
            <div class="k">ZEFENG 料號</div><div>${escapeHtml(part.aftermarket?.zefeng || "—")}</div>
            <div class="k">我家 SKU</div><div>${escapeHtml(part.sku || "—")}</div>
            <div class="k">${isTest(part) ? "測試記錄" : "核對來源"}</div><div>${escapeHtml(part.verification.source)}</div>
            <div class="k">${isTest(part) ? "測試日期" : "核對日期"}</div><div>${escapeHtml(part.verification.checkedAt)}</div>
          ` : ""}
          <div class="k">備註</div><div>${escapeHtml(part.note)}</div>
        </div>
      `;
    }

    function selectPart(id) {
      const focused = document.activeElement;
      const focusContainer = focused?.classList.contains("hotspot") ? canvasWrap : listEl;
      const restoreFocus = focused?.dataset.partId === id;
      state.activeId = id;
      const part = state.filtered.find(p => p.id === id) || partsData.find(p => p.id === id);
      renderDetail(part);
      renderList();
      renderHotspots();
      if (restoreFocus) focusContainer.querySelector(`[data-part-id="${id}"]`)?.focus();
    }

    function applyFilter(query) {
      state.query = query.trim();
      state.filtered = state.query ? partsData.filter(p => matches(p, state.query)) : [...partsData];

      if (!state.filtered.some(p => p.id === state.activeId)) {
        state.activeId = state.filtered[0]?.id || null;
      }

      renderList();
      renderHotspots();
      renderDetail(state.filtered.find(p => p.id === state.activeId));
    }

    function isValidIsoDate(value) {
      if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const [year, month, day] = value.split("-").map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      return date.getUTCFullYear() === year
        && date.getUTCMonth() === month - 1
        && date.getUTCDate() === day;
    }

    function isObject(value) {
      return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    function readText(object, key, context) {
      if (!Object.hasOwn(object, key)) return "";
      if (typeof object[key] !== "string") throw new Error(`${context}.${key} 必須是字串`);
      return object[key].trim();
    }

    function validateImportedParts(payload) {
      if (!isObject(payload)) throw new Error("資料必須是 JSON 物件");
      if (payload.schemaVersion !== 1) throw new Error("不支援的 schemaVersion");
      if (payload.catalog !== "toyota-7f-front-wheel") throw new Error("catalog 名稱不符");
      const value = payload.parts;
      if (!Array.isArray(value) || value.length === 0) throw new Error("parts 必須是非空陣列");
      const knownIds = new Set(placeholderParts.map(part => part.id));
      const seenIds = new Set();
      return value.map((part, index) => {
        if (!isObject(part)) throw new Error(`第 ${index + 1} 筆必須是物件`);
        if (typeof part.id !== "string" || !knownIds.has(part.id)) {
          throw new Error(`第 ${index + 1} 筆使用未知或無效 id`);
        }
        if (seenIds.has(part.id)) throw new Error(`id 重複：${part.id}`);
        seenIds.add(part.id);
        if (!isObject(part.verification)) throw new Error(`${part.id} 缺少有效的 verification`);
        const status = part.verification.status;
        if (status !== "verified" && status !== "test") {
          throw new Error(`${part.id} 必須標記為 verified 或 test；pending 不可載入`);
        }
        const source = readText(part.verification, "source", part.id + ".verification");
        if (!source) throw new Error(`${part.id} 缺少有效的來源或測試記錄 source`);
        if (!isValidIsoDate(part.verification.checkedAt)) {
          throw new Error(`${part.id} 的 checkedAt 必須是真實的 YYYY-MM-DD 日期`);
        }
        if (Object.hasOwn(part, "aftermarket") && !isObject(part.aftermarket)) {
          throw new Error(`${part.id}.aftermarket 必須是物件`);
        }
        const aftermarket = part.aftermarket || {};
        const base = placeholderParts.find(item => item.id === part.id);
        const normalized = {
          ...base,
          oem: readText(part, "oem", part.id),
          aftermarket: {
            jianzhang: readText(aftermarket, "jianzhang", part.id + ".aftermarket"),
            zefeng: readText(aftermarket, "zefeng", part.id + ".aftermarket"),
          },
          sku: readText(part, "sku", part.id),
          note: Object.hasOwn(part, "note") ? readText(part, "note", part.id) : base.note,
          verification: { status, source, checkedAt: part.verification.checkedAt },
        };
        if (status === "test" && hasPartNumber(normalized)) {
          throw new Error(`${part.id} 測試資料的所有料號與 SKU 必須留空`);
        }
        if (status === "verified" && !hasPartNumber(normalized)) {
          throw new Error(`${part.id} 未提供任何料號或 SKU；流程測試請使用 test`);
        }
        return normalized;
      });
    }

    document.getElementById("dataFile").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const payload = JSON.parse(await file.text());
        const importedParts = validateImportedParts(payload);
        const importedById = new Map(importedParts.map(part => [part.id, part]));
        partsData = placeholderParts.map(base =>
          importedById.get(base.id) || structuredClone(base)
        );
        state.activeId = null;
        dataStatus.className = "data-status";
        const verifiedCount = importedParts.filter(isVerified).length;
        const testCount = importedParts.filter(isTest).length;
        dataStatus.textContent = `已載入：${verifiedCount} 筆有核對紀錄、${testCount} 筆僅供測試，其餘 ${partsData.length - importedParts.length} 筆待確認。${testCount ? "測試資料不可報價。" : ""} 檔案：${file.name}`;
        applyFilter(searchInput.value);
      } catch (error) {
        dataStatus.className = "data-status error";
        dataStatus.textContent = `載入失敗：${error.message}`;
      } finally {
        event.target.value = "";
      }
    });

    document.getElementById("resetDataBtn").addEventListener("click", () => {
      partsData = structuredClone(placeholderParts);
      state.activeId = null;
      dataStatus.className = "data-status";
      dataStatus.textContent = "目前為展示模式：料號尚未核對，不可用於報價。";
      applyFilter(searchInput.value);
    });

    searchInput.addEventListener("input", (e) => applyFilter(e.target.value));
    document.getElementById("clearBtn").addEventListener("click", () => {
      searchInput.value = "";
      applyFilter("");
    });

    new ResizeObserver(() => {
      canvasWrap.querySelectorAll(".hotspot").forEach(button => {
        const part = partsData.find(item => item.id === button.dataset.partId);
        if (part) positionHotspot(button, part);
      });
    }).observe(canvasWrap);

    applyFilter("");
  </script>
</body>
</html>
